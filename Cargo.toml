[workspace]
resolver = "2"
members = [
    "crates/pulsebay-core",
    "crates/pulsebay-store",
    "crates/pulsebay-export",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
authors = ["Jean Seenivasagam <https://github.com/jeanseenivasagam/>"]
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
directories = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.80"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

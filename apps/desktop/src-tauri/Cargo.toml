[package]
name = "pulsebay-desktop"
version = "1.0.0"
description = "PulseBay Operations & Booking Console — Native Rust Windows Desktop Application"
authors = ["Jean Seenivasagam <https://github.com/jeanseenivasagam/>"]
edition = "2021"
license = "MIT"

[lib]
name = "pulsebay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
pulsebay-core = { path = "../../../crates/pulsebay-core" }
pulsebay-export = { path = "../../../crates/pulsebay-export" }
pulsebay-store = { path = "../../../crates/pulsebay-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
